name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install -e packages/mini_accum
          pip install pytest ruff

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check packages/mini_accum/src

      - name: Tests
        run: |
          source .venv/bin/activate
          pytest packages/mini_accum/tests -q

  gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: KPI sanity (anti-NaN)
        shell: zsh {0}
        run: scripts/ci/check_kpis.sh

      - name: Gate latest (estricto)
        shell: zsh {0}
        env:
          GATE_STRICT: '1'
        run: scripts/ci/gate_latest.sh