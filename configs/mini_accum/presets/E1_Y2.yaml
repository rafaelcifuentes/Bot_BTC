# Mini-Accum v2.0 — E1_Y2 (Año +2 post-halving)
preset: E1_Y2
version: 2.0
bar: 1d
data:
  ohlc_4h_csv: data/wf_canonical/BTC-USD_4h.csv # será sobreescrito por el runner
  ohlc_d1_csv: data/ohlc/1d/BTC-USD.csv # será sobreescrito por el runner
  ts_col: ts
  tz_input: UTC
backtest:
  reports_dir: reports/mini_accum/WF_YYYY/v2_0
  seed_btc: 1.0
risk:
  hard_dd_pct: 15
  atr_exit: false
rebalancing:
  frequency: 1
horizon:
  h_bars: 30
filters:
  macro_sma: 200
  adx:
    enabled: true
    period: 14
    min: 22
  exit_atr:
    enabled: false
  macro_sma_len: 200
  macro_sma_enabled: true
execution:
  gamma_bps: 0
  bull_bias_bps: 0
  fee_bps_per_side: 2.0
  slip_bps_per_side: 1.0
  dwell_hours: 3
costs:
  fee_bps_per_side: 2.0
  slip_bps_per_side: 1.0
discipline:
  bull_hold:
    enabled: false
    min_bars_after_entry: 2
    adx_min: 25
  cooldown_after_loss:
    enabled: false
    cooldown_bars: 12
  hibernation_on_chop:
    enabled: false
    adx_max: 20
    min_bars: 6
anti_whipsaw:
  dwell_bars_min_between_flips: 3 # decisión final para Y+2
strategy:
  params:
    ema_fast: 12
    ema_slow: 26
    rsi_len: 14
    rsi_buy: 35
    rsi_sell: 65
    adx_len: 14
    adx_min: 22
signals: # retro-compat con lectores v1.x
  ema_fast: 12
  ema_slow: 26
  rsi_len: 14
  rsi_buy: 35
  rsi_sell: 65
  adx_len: 14
  adx_min: 22
indicators:
  rsi:
    len: 14
    low: 35
    high: 65
  adx:
    len: 14
    min: 22
