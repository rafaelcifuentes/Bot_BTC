# Mini-Accum v2.0 — E1_Y2 (Año +2 post-halving)
preset: E1_Y2
version: 2.0
bar: 1d

data:
  ohlc_4h_csv: data/ohlc/4h/BTC-USD.csv
  ohlc_d1_csv: data/ohlc/1d/BTC-USD.csv
  ts_col: ts
  tz_input: UTC

backtest:
  reports_dir: reports/mini_accum/WF_YYYY/v2_0
  seed_btc: 1.0

risk: { hard_dd_pct: 0.15 }
rebalancing: { frequency: 1 }
horizon: { h_bars: 30 }

filters:
  macro_sma: 200
  adx: { enabled: true, period: 14, min: 22 }
  exit_atr: { enabled: false }

execution: { gamma_bps: 0, bull_bias_bps: 0 }
costs: { fee_bps_per_side: 2.0, slip_bps_per_side: 1.0 }

anti_whipsaw: { dwell_bars_min_between_flips: 3 }

strategy:
  params:
    ema_fast: 12
    ema_slow: 26
    rsi_len: 14
    rsi_buy: 35
    rsi_sell: 65
    adx_len: 14
    adx_min: 22

# Duplicado para retro-compat (lectores v1.x)
signals:
  ema_fast: 12
  ema_slow: 26
  rsi_len: 14
  rsi_buy: 35
  rsi_sell: 65
  adx_len: 14
  adx_min: 22
